name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore persistent Android debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with: { path: ~/.android/debug.keystore, key: aulaevidencia-stable-debug-keystore-v1 }
      - name: Create signing key on first stable build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: mkdir -p ~/.android && keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AulaEvidencia Stable Debug,O=AulaEvidencia,C=ES"
      - name: Signing key fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tee signing-key.txt
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Rebuild and validate web assets
        run: |
          mkdir -p app/src/main/assets/www/static app/src/main/assets/www/media
          cat chunks/appgz.00 chunks/appgz.01 | base64 -d | gunzip > app/src/main/assets/www/static/app.js
          cat exact/local.00 | base64 -d | gunzip > app/src/main/assets/www/static/local-api.js
          base64 -d exact/docio-bg.b64 > app/src/main/assets/www/media/docio-home-bg.jpg
          base64 -d exact/docio-logo.b64 > app/src/main/assets/www/media/docio-logo.jpg
          node --check app/src/main/assets/www/static/period-cumulative-criteria.js
          node --check app/src/main/assets/www/static/rubric-library-editor.js
          node --check app/src/main/assets/www/static/docio-professional-theme.js
          node --check app/src/main/assets/www/static/correction-import.js
          grep -q 'correction-import.js' app/src/main/assets/www/index.html
          grep -q 'DOCIO_CORRECTION_V1' app/src/main/assets/www/static/correction-import.js
          grep -q 'teacher_validated:true' app/src/main/assets/www/static/correction-import.js
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Verify APK and signer
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='es.aulaevidencia.personal.stable'" apk-badging.txt
          grep -q "versionName='1.2.27-docio'" apk-badging.txt
          grep -q "application-label:'DOCIO'" apk-badging.txt
          grep -q 'Signer #1 certificate SHA-256 digest: e33e997d020d3577852cfb06495e8f018fa8792fa1c86f1fd7935c941a1e31c3' apk-signature.txt
          unzip -p "$APK" assets/www/static/correction-import.js | grep -q 'DOCIO_CORRECTION_V1'
      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DOCIO-Cuaderno-Digital-1.2.27.apk
          sha256sum DOCIO-Cuaderno-Digital-1.2.27.apk > DOCIO-Cuaderno-Digital-1.2.27.apk.sha256
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOCIO-build-diagnostics-1.2.27
          path: |
            gradle-build.log
            apk-signature.txt
            apk-badging.txt
            signing-key.txt
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOCIO-APK-1.2.27
          path: |
            DOCIO-Cuaderno-Digital-1.2.27.apk
            DOCIO-Cuaderno-Digital-1.2.27.apk.sha256
