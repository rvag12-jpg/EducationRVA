name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild and validate web assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www/static
          cat chunks/appgz.00 chunks/appgz.01 | base64 -d | gunzip > app/src/main/assets/www/static/app.js
          cat chunks/localgz.00 chunks/localgz.01 | base64 -d | gunzip > app/src/main/assets/www/static/local-api.js
          node --check app/src/main/assets/www/static/app.js
          node --check app/src/main/assets/www/static/local-api.js
          test -s app/src/main/assets/www/static/app.js
          test -s app/src/main/assets/www/static/local-api.js
          wc -c app/src/main/assets/www/static/app.js app/src/main/assets/www/static/local-api.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AulaEvidencia-Personal-1.2.0-debug.apk
          sha256sum AulaEvidencia-Personal-1.2.0-debug.apk > AulaEvidencia-Personal-1.2.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AulaEvidencia-Personal-APK
          path: |
            AulaEvidencia-Personal-1.2.0-debug.apk
            AulaEvidencia-Personal-1.2.0-debug.apk.sha256
          if-no-files-found: error
