name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent Android debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aulaevidencia-stable-debug-keystore-v1

      - name: Create signing key on first stable build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AulaEvidencia Stable Debug,O=AulaEvidencia,C=ES"

      - name: Signing key fingerprint
        shell: bash
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tee signing-key.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild and validate web assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www/static app/src/main/assets/www/media
          cat chunks/appgz.00 chunks/appgz.01 | base64 -d | gunzip > app/src/main/assets/www/static/app.js
          cat exact/local.00 | base64 -d | gunzip > app/src/main/assets/www/static/local-api.js
          base64 -d exact/docio-bg.b64 > app/src/main/assets/www/media/docio-home-bg.jpg
          echo "07ffcd30e5b3c3a7d7e19d2475f768b43ffce968ad7af871780ef39615857b8e  app/src/main/assets/www/static/app.js" | sha256sum -c -
          echo "657c94723c51d43680bbb5ae6e3a87c37b9e9a8fe2ab573e93ea6bddf61da3c3  app/src/main/assets/www/static/local-api.js" | sha256sum -c -
          echo "048a1e7a0bc0add5d706a345a02a6a4a1c2c8dc1cc0b0004dbb89d3353efc267  app/src/main/assets/www/media/docio-home-bg.jpg" | sha256sum -c -
          node --check app/src/main/assets/www/static/app.js
          node --check app/src/main/assets/www/static/local-api.js
          node --check app/src/main/assets/www/static/delete-feature.js
          node --check app/src/main/assets/www/static/cumulative-grade.js
          node --check app/src/main/assets/www/static/resizable-columns.js
          node --check app/src/main/assets/www/static/assessment-colors.js
          node --check app/src/main/assets/www/static/gradebook-score-limits.js
          node --check app/src/main/assets/www/static/weekly-schedule.js
          node --check app/src/main/assets/www/static/docio-theme.js
          grep -q 'DOCIO' app/src/main/assets/www/static/app.js
          grep -q 'DOCIO · Cuaderno Digital' app/src/main/assets/www/index.html
          grep -q 'weekly-schedule.js' app/src/main/assets/www/index.html
          grep -q 'docio-theme.js' app/src/main/assets/www/index.html
          grep -q 'Horario semanal' app/src/main/assets/www/static/weekly-schedule.js
          grep -q 'Añadir clase semanal' app/src/main/assets/www/static/weekly-schedule.js
          grep -q "\['schedule','Horario'\]" app/src/main/assets/www/static/weekly-schedule.js
          grep -q 'docio-home-bg.jpg' app/src/main/assets/www/static/docio-theme.js
          grep -q "input.max = '10'" app/src/main/assets/www/static/gradebook-score-limits.js
          grep -q "input.step = '0.01'" app/src/main/assets/www/static/gradebook-score-limits.js

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info --console=plain 2>&1 | tee gradle-build.log

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='es.aulaevidencia.personal.stable'" apk-badging.txt
          grep -q "versionName='1.2.12-docio'" apk-badging.txt
          grep -q "application-label:'DOCIO'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          unzip -p "$APK" assets/www/index.html | grep -q 'DOCIO · Cuaderno Digital'
          unzip -p "$APK" assets/www/static/weekly-schedule.js | grep -q 'Horario semanal'
          unzip -p "$APK" assets/www/static/weekly-schedule.js | grep -q 'Añadir clase semanal'
          unzip -p "$APK" assets/www/static/resizable-columns.js | grep -q 'Ajustar columnas'
          unzip -p "$APK" assets/www/static/docio-theme.js | grep -q 'docio-home-bg.jpg'
          unzip -l "$APK" | grep -q 'assets/www/media/docio-home-bg.jpg'

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DOCIO-Cuaderno-Digital-1.2.12.apk
          sha256sum DOCIO-Cuaderno-Digital-1.2.12.apk > DOCIO-Cuaderno-Digital-1.2.12.apk.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOCIO-build-diagnostics-1.2.12
          path: |
            gradle-build.log
            apk-signature.txt
            apk-badging.txt
            signing-key.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOCIO-APK-1.2.12
          path: |
            DOCIO-Cuaderno-Digital-1.2.12.apk
            DOCIO-Cuaderno-Digital-1.2.12.apk.sha256
          if-no-files-found: error
