name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent Android debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aulaevidencia-stable-debug-keystore-v1

      - name: Create signing key on first stable build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AulaEvidencia Stable Debug,O=AulaEvidencia,C=ES"

      - name: Signing key fingerprint
        shell: bash
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tee signing-key.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild and validate web assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www/static
          cat chunks/appgz.00 chunks/appgz.01 | base64 -d | gunzip > app/src/main/assets/www/static/app.js
          cat exact/local.00 | base64 -d | gunzip > app/src/main/assets/www/static/local-api.js
          echo "9298129f1f9fe0b59bb6719a1e1cd726966f659c007171dee25b84596b96beab  app/src/main/assets/www/static/app.js" | sha256sum -c -
          echo "657c94723c51d43680bbb5ae6e3a87c37b9e9a8fe2ab573e93ea6bddf61da3c3  app/src/main/assets/www/static/local-api.js" | sha256sum -c -
          node --check app/src/main/assets/www/static/app.js
          node --check app/src/main/assets/www/static/local-api.js
          node --check app/src/main/assets/www/static/delete-feature.js
          node --check app/src/main/assets/www/static/cumulative-grade.js
          node --check app/src/main/assets/www/static/resizable-columns.js
          node --check app/src/main/assets/www/static/assessment-colors.js
          grep -q 'id="manualScore"' app/src/main/assets/www/static/app.js
          grep -q 'step="0.01"' app/src/main/assets/www/static/app.js
          grep -q 'Corrección numérica sin rúbrica' app/src/main/assets/www/static/app.js

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --info --console=plain 2>&1 | tee gradle-build.log

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='es.aulaevidencia.personal.stable'" apk-badging.txt
          grep -q "versionName='1.2.9-personal'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AulaEvidencia-Personal-1.2.9-estable.apk
          sha256sum AulaEvidencia-Personal-1.2.9-estable.apk > AulaEvidencia-Personal-1.2.9-estable.apk.sha256

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AulaEvidencia-build-diagnostics-1.2.9
          path: |
            gradle-build.log
            apk-signature.txt
            apk-badging.txt
            signing-key.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AulaEvidencia-Personal-APK-1.2.9
          path: |
            AulaEvidencia-Personal-1.2.9-estable.apk
            AulaEvidencia-Personal-1.2.9-estable.apk.sha256
          if-no-files-found: error
