name: Build CorrectorDocio APK

on:
  push:
    branches:
      - chatgpt/correctordocio-apk-v1
    paths:
      - build-input/READY

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct source
        run: |
          cat build-input/source.part* | base64 -d > /tmp/CorrectorDocio_Source.zip
          unzip -q /tmp/CorrectorDocio_Source.zip -d /tmp/correctordocio
          test -f /tmp/correctordocio/CorrectorDocio/app/build.gradle

      - name: Compile APK
        working-directory: /tmp/correctordocio/CorrectorDocio
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare output
        run: |
          mkdir -p build-output-correctordocio
          cp /tmp/correctordocio/CorrectorDocio/app/build/outputs/apk/debug/app-debug.apk build-output-correctordocio/CorrectorDocio.apk
          sha256sum build-output-correctordocio/CorrectorDocio.apk > build-output-correctordocio/CorrectorDocio.apk.sha256
          unzip -t build-output-correctordocio/CorrectorDocio.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorrectorDocio-APK
          path: build-output-correctordocio/CorrectorDocio.apk
          if-no-files-found: error

      - name: Commit compiled APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output-correctordocio/CorrectorDocio.apk build-output-correctordocio/CorrectorDocio.apk.sha256
          git commit -m "Build CorrectorDocio APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
