name: Build CorrectorDocio APK

on:
  push:
    branches:
      - chatgpt/correctordocio-apk-final

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct ChatGPT Plus flow and rename app
        run: |
          cat plus-build/main.part* | base64 -d > CorrectorQuimicaAndroid/app/src/main/java/es/iesvirgendelacaridad/corrector/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          p = Path('CorrectorQuimicaAndroid/app/src/main/java/es/iesvirgendelacaridad/corrector/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'TextView title = text\("[^"]*", 24, true\);', 'TextView title = text("CorrectorDocio", 24, true);', s, count=1)
          p.write_text(s, encoding='utf-8')

          m = Path('CorrectorQuimicaAndroid/app/src/main/AndroidManifest.xml')
          x = m.read_text(encoding='utf-8')
          x = re.sub(r'android:label="[^"]*"', 'android:label="CorrectorDocio"', x, count=1)
          x = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', x, count=1)
          x = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="false"', x, count=1)
          x = re.sub(r'\s*<uses-permission android:name="android.permission.INTERNET"\s*/>\s*', '\n', x)
          m.write_text(x, encoding='utf-8')
          PY
          if grep -R "HttpURLConnection\|api.openai.com\|OPENAI_API_KEY" CorrectorQuimicaAndroid/app/src/main; then
            echo "Error: el cliente Android contiene acceso API directo" >&2
            exit 1
          fi
          if grep -q 'uses-permission.*INTERNET' CorrectorQuimicaAndroid/app/src/main/AndroidManifest.xml; then
            echo "Error: CorrectorDocio no debe pedir permiso INTERNET" >&2
            exit 1
          fi
          grep -q 'CorrectorDocio' CorrectorQuimicaAndroid/app/src/main/AndroidManifest.xml
          grep -q 'CorrectorDocio' CorrectorQuimicaAndroid/app/src/main/java/es/iesvirgendelacaridad/corrector/MainActivity.java

      - name: Compile APK debug
        working-directory: CorrectorQuimicaAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK and checksum
        run: |
          mkdir -p build-output-correctordocio
          cp CorrectorQuimicaAndroid/app/build/outputs/apk/debug/app-debug.apk build-output-correctordocio/CorrectorDocio.apk
          sha256sum build-output-correctordocio/CorrectorDocio.apk > build-output-correctordocio/CorrectorDocio.apk.sha256
          unzip -t build-output-correctordocio/CorrectorDocio.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorrectorDocio-APK
          path: build-output-correctordocio/CorrectorDocio.apk
          if-no-files-found: error

      - name: Commit compiled APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output-correctordocio/CorrectorDocio.apk build-output-correctordocio/CorrectorDocio.apk.sha256
          git commit -m "Build CorrectorDocio APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
