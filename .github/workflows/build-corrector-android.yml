name: Build Corrector Quimica ChatGPT Plus

on:
  push:
    branches:
      - chatgpt/corrector-quimica-plus-v3

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Reconstruct compact Plus MainActivity
        run: |
          cat plus-build/main.part* | base64 -d > CorrectorQuimicaAndroid/app/src/main/java/es/iesvirgendelacaridad/corrector/MainActivity.java
          if grep -R "HttpURLConnection\|api.openai.com\|OPENAI_API_KEY" CorrectorQuimicaAndroid/app/src/main; then exit 1; fi
          if grep -q 'uses-permission.*INTERNET' CorrectorQuimicaAndroid/app/src/main/AndroidManifest.xml; then exit 1; fi
      - name: Compile APK debug
        working-directory: CorrectorQuimicaAndroid
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK and checksum
        run: |
          mkdir -p build-output-plus
          cp CorrectorQuimicaAndroid/app/build/outputs/apk/debug/app-debug.apk build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk
          sha256sum build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk > build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorrectorQuimica-ChatGPT-PLUS-APK
          path: build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk
          if-no-files-found: error
      - name: Commit compiled APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk build-output-plus/CorrectorQuimica_2Bach_ChatGPT_PLUS.apk.sha256
          git commit -m "Build ChatGPT Plus Android APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
