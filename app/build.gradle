plugins { id 'com.android.application' }
android {
 namespace 'es.aulaevidencia.android'; compileSdk 36
 signingConfigs { stableDebug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 defaultConfig { applicationId 'es.aulaevidencia.personal.stable'; minSdk 26; targetSdk 36; versionCode 30; versionName '1.2.27-docio' }
 buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.stableDebug }; release { minifyEnabled true; shrinkResources true; debuggable false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.17.0'; implementation 'androidx.core:core-ktx:1.17.0'; implementation 'androidx.fragment:fragment:1.8.9'; implementation 'androidx.biometric:biometric:1.1.0' }
